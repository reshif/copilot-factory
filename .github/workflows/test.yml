name: test

# Tier 0 (static quality lints: tests/quality-lint.test.js, packaging.test.js) and Tier 1
# (contract tests, harness logic) on every PR, no model cost. Tier 2/3 run in evals.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: git identity for the test repos
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: factory
        working-directory: plugins/factory
        run: npm test
      - name: factory-inspector
        working-directory: plugins/factory-inspector
        run: npm test
